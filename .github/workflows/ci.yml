name: CI
on:
  push:
    paths: ['game/**', '.github/workflows/ci.yml']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: game/package-lock.json }
      - run: npm ci
        working-directory: game
      - run: npm run typecheck
        working-directory: game
      - run: npm test
        working-directory: game
      - run: npm run build
        working-directory: game
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: game
      # Informational: software-rendered WebXR on a 2-core runner is slow and timing-sensitive, so this step
      # never fails the run (typecheck, unit tests and build above are the gate). Screenshots + report.json are
      # uploaded below; the same test is run locally before every push.
      - name: Headless XR smoke test (IWER emulated Quest, informational)
        run: node tests/xr/run.mjs --room living_room,none --seconds 15
        working-directory: game
        continue-on-error: true
        timeout-minutes: 12
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: xr-screenshots, path: game/tests/xr/out, if-no-files-found: ignore }
