# GO TO BED!!! - voice lines (source of truth for tools/build-voices.sh)
# Lines are taken from docs/01-game-design.md (roster + bosses + ghost) and the
# chapter 3 onboarding prompts in docs/04-chapter3-house-mr.md.
#
# Schema per line:
#   id          snake_case, unique; also the output file name voice/<id>.ogg
#   speaker     scamp|clinger|potato|breacher|stinky|siren|zombie|crawler|ghost|bigbean|narrator
#   text        what is synthesised and subtitled, 12 words or fewer
#   emotion     neutral|whine|scream|giggle|sleepy|monotone  (drives the processing chain)
#   trigger     free text: the state / event that plays the line
#   cooldown_s  seconds before the same line may play again
#
# Second takes (<id>_b.ogg, pitch +3%) are rendered for the 15 lines with the
# lowest cooldown_s (the most repeated ones), ties broken by file order.
lines:
  # ---------------------------------------------------------------- Scamp
  - id: scamp_not_tired
    speaker: scamp
    text: "I'm not tired!"
    emotion: whine
    trigger: SPAWN walk-out of a portal
    cooldown_s: 4
  - id: scamp_five_more_minutes
    speaker: scamp
    text: "You said five more minutes!"
    emotion: whine
    trigger: ROAM, random bark
    cooldown_s: 12
  - id: scamp_blue_cup
    speaker: scamp
    text: "I want the blue cup. NOT that blue cup."
    emotion: whine
    trigger: ROAM, random bark
    cooldown_s: 20
  - id: scamp_carry_me
    speaker: scamp
    text: "Carry me. Carry me. CARRY ME."
    emotion: scream
    trigger: CHASE arms raised, before the shin-slap wind-up
    cooldown_s: 5
  - id: scamp_telling_grandma
    speaker: scamp
    text: "I'm telling Grandma."
    emotion: neutral
    trigger: RECOVER after a missed attack
    cooldown_s: 15
  - id: scamp_why
    speaker: scamp
    text: "Why?"
    emotion: whine
    trigger: TAUNT (repeat3 - the game plays it three times, rising)
    cooldown_s: 3
  - id: scamp_cheetah
    speaker: scamp
    text: "I'm a cheetah!"
    emotion: giggle
    trigger: CHASE start at 3 m
    cooldown_s: 10
  - id: scamp_watch_this
    speaker: scamp
    text: "Watch this!"
    emotion: giggle
    trigger: climbing a table for line of sight
    cooldown_s: 12
  - id: scamp_ew
    speaker: scamp
    text: "Ew."
    emotion: neutral
    trigger: spawned out of a Stinky DETONATE cloud
    cooldown_s: 6
  - id: scamp_i_have_to_pee
    speaker: scamp
    text: "I have to pee."
    emotion: whine
    trigger: ROAM bark near a door; chapter 2 Pee Ask callback
    cooldown_s: 25

  # -------------------------------------------------------------- Clinger
  - id: clinger_up_up_up
    speaker: clinger
    text: "Up! Up! UP!"
    emotion: scream
    trigger: LEAP tell (crouch and wiggle 0.7 s)
    cooldown_s: 3
  - id: clinger_mine
    speaker: clinger
    text: "Mine."
    emotion: neutral
    trigger: CLING attached to the weapon hand, every 2nd bite
    cooldown_s: 2
  - id: clinger_i_hold_it
    speaker: clinger
    text: "I hold it."
    emotion: neutral
    trigger: CLING attached, reload blocked
    cooldown_s: 8
  - id: clinger_dont_put_me_down
    speaker: clinger
    text: "Nooo don't put me down."
    emotion: whine
    trigger: SHAKEN, flung off the weapon hand
    cooldown_s: 6
  - id: clinger_hug
    speaker: clinger
    text: "Hug?"
    emotion: neutral
    trigger: STALK entering the player's view edge
    cooldown_s: 10
  - id: clinger_boop
    speaker: clinger
    text: "Boop."
    emotion: giggle
    trigger: touching the player's face
    cooldown_s: 6

  # --------------------------------------------------------- Couch Potato
  - id: potato_good_part
    speaker: potato
    text: "Shh, this is the good part."
    emotion: neutral
    trigger: THROW tell, remote raised before every cushion
    cooldown_s: 3
  - id: potato_in_the_way
    speaker: potato
    text: "You're in the way of the TV."
    emotion: whine
    trigger: SIT, player crosses between couch and screen
    cooldown_s: 12
  - id: potato_one_more_episode
    speaker: potato
    text: "One more episode."
    emotion: whine
    trigger: SIT idle bark
    cooldown_s: 15
  - id: potato_scoot
    speaker: potato
    text: "Scoot."
    emotion: neutral
    trigger: EVICT, shoving a sitter 1 m
    cooldown_s: 4
  - id: potato_this_spot_first
    speaker: potato
    text: "I had this spot FIRST."
    emotion: scream
    trigger: EVICT contested seat
    cooldown_s: 12
  - id: potato_snack_snack_snack
    speaker: potato
    text: "Snack. Snack. Snack."
    emotion: neutral
    trigger: BOUNCE every 2 s, 20% chance
    cooldown_s: 10
  - id: potato_i_was_watching
    speaker: potato
    text: "I was WATCHING that!"
    emotion: scream
    trigger: EVICTED by three Wipe slaps or a shot cushion
    cooldown_s: 8

  # ------------------------------------------------------------- Breacher
  - id: breacher_knock_knock
    speaker: breacher
    text: "Knock knock. Knock knock. KNOCK KNOCK."
    emotion: scream
    trigger: KNOCK, three knocks over 2.4 s behind a door
    cooldown_s: 2
  - id: breacher_coming_in
    speaker: breacher
    text: "I'm coming in!"
    emotion: scream
    trigger: KICK, panel swings open
    cooldown_s: 6
  - id: breacher_door_already_open
    speaker: breacher
    text: "The door was already open."
    emotion: neutral
    trigger: TA-DA pose (it was not)
    cooldown_s: 15
  - id: breacher_ta_da
    speaker: breacher
    text: "TA-DA!"
    emotion: giggle
    trigger: TA-DA pose, 1.2 s
    cooldown_s: 6
  - id: breacher_ow_my_face
    speaker: breacher
    text: "Ow my whole face."
    emotion: whine
    trigger: Door Slam counter, DIZZY entrance
    cooldown_s: 5
  - id: breacher_knight
    speaker: breacher
    text: "I'm a knight!"
    emotion: giggle
    trigger: RUSH start
    cooldown_s: 12

  # --------------------------------------------------------------- Stinky
  - id: stinky_change_my_diaper
    speaker: stinky
    text: "Change my diaper."
    emotion: whine
    trigger: DEMAND, 10 s ring starts
    cooldown_s: 3
  - id: stinky_change_my_diaper_scream
    speaker: stinky
    text: "Change my diaper!"
    emotion: scream
    trigger: DEMAND, ring under 3 s left
    cooldown_s: 4
  - id: stinky_made_a_present
    speaker: stinky
    text: "I made a present."
    emotion: giggle
    trigger: WADDLE arrival bark
    cooldown_s: 12
  - id: stinky_its_warm
    speaker: stinky
    text: "It's warm."
    emotion: neutral
    trigger: DEMAND idle, ring half gone
    cooldown_s: 12
  - id: stinky_dont_look
    speaker: stinky
    text: "Don't look at me."
    emotion: whine
    trigger: player aims at it during DEMAND
    cooldown_s: 10
  - id: stinky_not_done
    speaker: stinky
    text: "I'm not done."
    emotion: neutral
    trigger: Wipe sweep interrupted before 1.5 s
    cooldown_s: 6
  - id: stinky_thank_you
    speaker: stinky
    text: "Thank you."
    emotion: sleepy
    trigger: CHANGED, friendly ghost, +50 XP
    cooldown_s: 4

  # ---------------------------------------------------------------- Siren
  - id: siren_inhale
    speaker: siren
    text: "I... I... I..."
    emotion: whine
    trigger: INHALE start, 2.5 s tell
    cooldown_s: 2
  - id: siren_scream
    speaker: siren
    text: "Aaaaaaaaah!"
    emotion: scream
    trigger: SCREAM, 1.5 s, 5 m radius (layer over sfx/scream_siren)
    cooldown_s: 2
  - id: siren_wasnt_screaming
    speaker: siren
    text: "I wasn't even screaming."
    emotion: neutral
    trigger: Shushed by the Wipe hand (looks betrayed)
    cooldown_s: 8
  - id: siren_you_scream
    speaker: siren
    text: "You scream."
    emotion: neutral
    trigger: EXHAUSTED, 3 s
    cooldown_s: 10
  - id: siren_mister_hop_mad
    speaker: siren
    text: "Mister Hop is MAD."
    emotion: scream
    trigger: APPROACH reaching a perch
    cooldown_s: 15
  - id: siren_again
    speaker: siren
    text: "Again!"
    emotion: giggle
    trigger: rest over, next APPROACH
    cooldown_s: 8

  # -------------------------------------------------------- Tablet Zombie
  - id: zombie_scuse_me
    speaker: zombie
    text: "'scuse me."
    emotion: monotone
    trigger: BUMP, every second
    cooldown_s: 2
  - id: zombie_tablet_broke
    speaker: zombie
    text: "My tablet broke!"
    emotion: scream
    trigger: PANIC, tablet shield destroyed
    cooldown_s: 3
  - id: zombie_still_charging
    speaker: zombie
    text: "It's still charging."
    emotion: monotone
    trigger: SHUFFLE idle bark
    cooldown_s: 12
  - id: zombie_one_more_video
    speaker: zombie
    text: "One more video."
    emotion: monotone
    trigger: SHUFFLE idle bark; zombie-kids inside the portal
    cooldown_s: 10
  - id: zombie_wheres_wifi
    speaker: zombie
    text: "Where's the WiFi."
    emotion: monotone
    trigger: standing in a door frame, holding the portal open
    cooldown_s: 12
  - id: zombie_skip_ad
    speaker: zombie
    text: "Skip ad. Skip ad. SKIP AD."
    emotion: scream
    trigger: sat on a couch with a tablet (double shield)
    cooldown_s: 10
  - id: zombie_still_watching
    speaker: zombie
    text: "Are you still watching?"
    emotion: monotone
    trigger: player idle 8 s in its view
    cooldown_s: 15
  - id: zombie_is_it_tomorrow
    speaker: zombie
    text: "Is it tomorrow yet?"
    emotion: monotone
    trigger: zombie-kids inside the portal sub-scene
    cooldown_s: 12
  - id: zombie_we_never_nap
    speaker: zombie
    text: "We never nap."
    emotion: monotone
    trigger: zombie-kids inside the portal sub-scene
    cooldown_s: 12

  # -------------------------------------------------------------- Crawler
  - id: crawler_peekaboo
    speaker: crawler
    text: "Peekaboo."
    emotion: giggle
    trigger: PEEK, head out from under furniture
    cooldown_s: 4
  - id: crawler_doggy
    speaker: crawler
    text: "I'm a doggy."
    emotion: giggle
    trigger: SCUTTLE start
    cooldown_s: 10
  - id: crawler_woof
    speaker: crawler
    text: "Woof."
    emotion: neutral
    trigger: ANKLE_BITE latch
    cooldown_s: 4
  - id: crawler_found_raisin
    speaker: crawler
    text: "Found a raisin."
    emotion: neutral
    trigger: Raisin pickup (ghost line on drop)
    cooldown_s: 6
  - id: crawler_no_no_no
    speaker: crawler
    text: "No no no no."
    emotion: whine
    trigger: flicked off the ankle by the Wipe
    cooldown_s: 6
  - id: crawler_hee_hee
    speaker: crawler
    text: "Hee hee."
    emotion: giggle
    trigger: HIDE tell, giggle from under furniture
    cooldown_s: 2

  # ---------------------------------------------------------------- Ghost
  - id: ghost_weee
    speaker: ghost
    text: "Weee!"
    emotion: giggle
    trigger: pop ghost billboard, 0.6 s float
    cooldown_s: 1
  - id: ghost_night_night
    speaker: ghost
    text: "Night night."
    emotion: sleepy
    trigger: pop ghost billboard, 0.6 s float
    cooldown_s: 1
  - id: ghost_again
    speaker: ghost
    text: "Again!"
    emotion: giggle
    trigger: pop ghost billboard, 0.6 s float
    cooldown_s: 1

  # ------------------------------------------------------------- Big Bean
  - id: bigbean_gimme
    speaker: bigbean
    text: "GIMME."
    emotion: scream
    trigger: Grab phase, arm sweep from the doorway
    cooldown_s: 5
  - id: bigbean_change_my_diaper
    speaker: bigbean
    text: "CHANGE. MY. DIAPER."
    emotion: scream
    trigger: Demand phase, shared 20 s diaper ring
    cooldown_s: 8
  - id: bigbean_no_fit
    speaker: bigbean
    text: "No fit. NO FIT."
    emotion: scream
    trigger: Tantrum phase, floor slaps
    cooldown_s: 8
  - id: bigbean_hop
    speaker: bigbean
    text: "Hop?"
    emotion: neutral
    trigger: a Pacifier or Mister Hop thrown in view
    cooldown_s: 10
  - id: bigbean_up
    speaker: bigbean
    text: "Up."
    emotion: neutral
    trigger: Grab phase, arm raised
    cooldown_s: 6
  - id: bigbean_peek
    speaker: bigbean
    text: "PEEK!"
    emotion: giggle
    trigger: Peek-a-boo phase, face in a window or door frame
    cooldown_s: 5
  - id: bigbean_night_night
    speaker: bigbean
    text: "Night night."
    emotion: sleepy
    trigger: defeated, slides out of the doorway
    cooldown_s: 60

  # ----------------------------------------------- Narrator (the Dreamgate)
  - id: narrator_room_scan_found
    speaker: narrator
    text: "Room scan found. We'll use it."
    emotion: monotone
    trigger: chapter 3 onboarding, mesh-detection or depth-sensing available
    cooldown_s: 60
  - id: narrator_no_scan_found
    speaker: narrator
    text: "No scan found. Let's draw your room."
    emotion: monotone
    trigger: chapter 3 onboarding, Blueprint path
    cooldown_s: 60
  - id: narrator_mark_door
    speaker: narrator
    text: "Mark the door you're most afraid of."
    emotion: monotone
    trigger: Blueprint, first door prompt
    cooldown_s: 30
  - id: narrator_wave_one
    speaker: narrator
    text: "Wave one."
    emotion: monotone
    trigger: first wave start
    cooldown_s: 60
  - id: narrator_wave_clear
    speaker: narrator
    text: "Wave clear. Nobody is in bed."
    emotion: monotone
    trigger: wave end, lull phase
    cooldown_s: 30
  - id: narrator_tier_up_double_binky
    speaker: narrator
    text: "Tier up: Double Binky."
    emotion: monotone
    trigger: BINKY promotion to Tier 1 (15 lifetime pops)
    cooldown_s: 60
  - id: narrator_tier_up_diaper_cannon
    speaker: narrator
    text: "Tier up: Diaper Cannon."
    emotion: monotone
    trigger: BINKY promotion to Tier 4 (160 lifetime pops)
    cooldown_s: 60
  - id: narrator_door_shimmer
    speaker: narrator
    text: "Something is behind the door."
    emotion: monotone
    trigger: first Breacher BEHIND_DOOR, baby monitor crackle
    cooldown_s: 60
  - id: narrator_big_bean
    speaker: narrator
    text: "Something big is in the doorway."
    emotion: monotone
    trigger: Big Bean boss intro
    cooldown_s: 60
  - id: narrator_go_to_bed
    speaker: narrator
    text: "Go to bed."
    emotion: monotone
    trigger: game over / chapter end card
    cooldown_s: 60
